<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Undersea Cable X-Ray</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#050607;color:#c6dcef;font-family:"IBM Plex Mono",ui-monospace,monospace}
#wrap{display:flex;flex-direction:column;height:100%}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}

#bar button{background:none;border:1px solid #2a3642;color:inherit;font:inherit;padding:5px 12px;cursor:pointer}
#bar button:focus-visible,#bar input:focus-visible{outline:2px solid #ff9a22}

#bar label{display:flex;align-items:center;gap:5px;white-space:nowrap}
body.render #bar{display:none}

<div id="wrap"><div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar"><button id="play" aria-label="Play or pause">Pause</button><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Scrub"><span id="time">0.00 / 0.00</span>
<button id="snd">Sound on</button><label><input id="loop" type="checkbox" checked> loop</label></div></div>
<script type="text/plain" id="src-stage">// STAGE: a small film-style rendering kit for three.js motion graphics. Classic script; needs a global THREE (core only,
// no addons). It gives every style the same pipeline:
//   - one clock: stage.seek(t) builds the whole frame for time t, so frames can be rendered alone and in any order
//   - accumulation rendering: each frame is the average of N sub-renders, which gives real motion blur, anti-aliasing,
//     true depth of field (the camera moves across a lens aperture) and soft area-light shadows (lights move across
//     their own surface), all without post-process tricks
//   - HDR bloom, tone mapping, vignette, grain, chromatic aberration and a crisp 2D overlay for captions
//   - code-built lighting environments (no HDRI files), a real mirror floor, canvas textures, text planes, easing,
//     seeded random and noise
// Globals: K (helpers) and registerStyle(). A style is { id, name, ..., render: {...}, build(S) -> { update(t), overlay? } }.
(function (root) {
  const THREE = root.THREE;
  const K = {};
  const STYLES = [];
  root.STYLES = STYLES;
  root.registerStyle = (s) => { STYLES.push(s); return s; };

  // ---------------------------------------------------------------- maths
  K.clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  K.lerp = (a, b, t) => a + (b - a) * t;
  K.map = (x, a, b, c, d) => c + (d - c) * K.clamp((x - a) / (b - a));
  K.smooth = (a, b, x) => { const t = K.clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

  K.ease = {
    linear: (t) => t,
    in: (t) => t * t * t,
    out: (t) => 1 - Math.pow(1 - t, 3),
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outQuint: (t) => 1 - Math.pow(1 - t, 5),
    inOutQuint: (t) => (t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2),
    outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inExpo: (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
    outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
    inBack: (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t,
    outElastic: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1),

  // arrays; the ease on a key shapes the move INTO that key.
  K.track = (keys) => (t) => {

  // the first key and out at the last). Use it for camera moves that should feel like one continuous shot.

      return arr ? out : out[0];

  K.rng = (seed) => {
    let a = (typeof seed === 'string' ? [...seed].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261) : seed * 2654435761) >>> 0;

    r.range = (lo, hi) => lo + (hi - lo) * r();
    r.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * r());

    r.gauss = () => { let u = 0, v = 0; while (u === 0) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  K.hash = (x, y = 0, z = 0) => { let h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123; return h - Math.floor(h); };

    const r = K.rng(seed), p = new Uint8Array(512), perm = Array.from({ length: 256 }, (_, i) => i);
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }

      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z), A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      const L = K.lerp;
      return L(L(L(grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z), u), L(grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z), u), v),
        L(L(grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1), u), L(grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    };
    const fbm = (x, y, z = 0, oct = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); a *= 0.5; f *= 2; } return s; };

  };

  // ---------------------------------------------------------------- textures, text, geometry
  // K.canvasTex(1024, 512, (ctx, w, h) => {...}) -> THREE.CanvasTexture (sRGB, mipmapped). Redraw with tex.redraw(fn).
  K.canvasTex = (w, h, draw, opts = {}) => {
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    if (draw) draw(ctx, w, h);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = opts.data ? THREE.NoColorSpace : THREE.SRGBColorSpace;
    tex.anisotropy = 8; tex.generateMipmaps = true; tex.minFilter = THREE.LinearMipmapLinearFilter;
    if (opts.repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(opts.repeat[0], opts.repeat[1]); }
    tex.redraw = (fn) => { ctx.clearRect(0, 0, w, h); fn(ctx, w, h); tex.needsUpdate = true; };
    tex.canvas2d = cv; tex.ctx = ctx;
    return tex;
  };
  // A flat piece of text living in the 3D world. K.textPlane('Hello', { font: '800 160px "Inter"', color: '#fff',
  // height: 0.5 }) -> Mesh whose world height is `height` units per line. opts: align, lineHeight, glow (emissive
  // multiplier for bloom), lit (use a lit material so it takes shadows), maxWidthPx, letterSpacing (px), pad (px).
  K.textPlane = (text, o = {}) => {
    const font = o.font || '700 160px "Inter"', px = +(/(\d+(?:\.\d+)?)px/.exec(font) || [0, 160])[1];
    const lines = String(text).split('\n'), lh = (o.lineHeight || 1.12) * px, pad = o.pad == null ? Math.ceil(px * 0.25) : o.pad;
    const m = document.createElement('canvas').getContext('2d'); m.font = font;
    if (o.letterSpacing) m.letterSpacing = o.letterSpacing + 'px';
    const wpx = Math.ceil(Math.max(...lines.map((l) => m.measureText(l).width))) + pad * 2, hpx = Math.ceil(lh * lines.length) + pad * 2;
    const tex = K.canvasTex(wpx, hpx, (ctx) => {
      ctx.font = font; if (o.letterSpacing) ctx.letterSpacing = o.letterSpacing + 'px';
      ctx.textBaseline = 'middle'; ctx.textAlign = o.align || 'center'; ctx.fillStyle = o.color || '#ffffff';
      const x = o.align === 'left' ? pad : o.align === 'right' ? wpx - pad : wpx / 2;
      lines.forEach((l, i) => ctx.fillText(l, x, pad + lh * (i + 0.5)));
    });
    const unit = (o.height || 1) / px, hWorld = hpx * unit, wWorld = wpx * unit; // `height` = world size of the font's px size
    const mat = o.lit
      ? new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.02, roughness: o.roughness == null ? 0.8 : o.roughness, metalness: 0 })
      : new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
    if (o.glow && !o.lit) mat.color.setScalar(o.glow);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(wWorld, hWorld), mat);
    mesh.userData.size = [wWorld, hWorld]; mesh.userData.tex = tex;
    return mesh;
  };
  // Box with rounded edges, centred on the origin. r = edge radius, seg = roundness.
  K.roundedBox = (w, h, d, r = 0.05, seg = 6) => {
    r = Math.max(1e-4, Math.min(r, w / 2, h / 2, d / 2));
    const N = 2 * seg + 1, g = new THREE.BoxGeometry(2, 2, 2, N, N, N), p = g.attributes.position, nrm = g.attributes.normal;
    const half = [w / 2 - r, h / 2 - r, d / 2 - r], v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      const c = [p.getX(i), p.getY(i), p.getZ(i)], inner = [0, 0, 0], a = [0, 0, 0];
      for (let k = 0; k < 3; k++) {
        const idx = Math.round((c[k] + 1) * N / 2), side = idx <= seg ? -1 : 1;
        a[k] = idx <= seg ? -(1 - idx / seg) : (idx - seg - 1) / seg; inner[k] = side * half[k];
      }
      v.set(Math.tan(a[0] * Math.PI / 4), Math.tan(a[1] * Math.PI / 4), Math.tan(a[2] * Math.PI / 4)).normalize();
      p.setXYZ(i, inner[0] + v.x * r, inner[1] + v.y * r, inner[2] + v.z * r); nrm.setXYZ(i, v.x, v.y, v.z);
    }
    // UVs: each of the six sides is mapped flat, 0..1 across the whole side, so textures are not stretched at the corners
    const uv = g.attributes.uv, per = (N + 1) * (N + 1), sz = [w, h, d];
    const ax = [[2, 1, -1], [2, 1, 1], [0, 2, 1, -1], [0, 2, 1, 1], [0, 1, 1], [0, 1, -1]];   // [u axis, v axis, u sign, v sign] for +x -x +y -y +z -z
    for (let i = 0; i < p.count; i++) {
      const f = ax[Math.min(5, Math.floor(i / per))], c = [p.getX(i), p.getY(i), p.getZ(i)];
      uv.setXY(i, f[2] * c[f[0]] / sz[f[0]] + 0.5, (f[3] || 1) * c[f[1]] / sz[f[1]] + 0.5);
    }
    g.computeBoundingBox(); g.computeBoundingSphere();
    return g;
  };
  // Flat rounded rectangle (a card, a screen, a tile), in the XY plane facing +Z, with UVs 0..1 across it.
  K.roundedRect = (w, h, r = 0.05, seg = 8) => {
    const s = new THREE.Shape(), x = w / 2, y = h / 2; r = Math.min(r, x, y);
    s.moveTo(-x + r, -y); s.lineTo(x - r, -y); s.absarc(x - r, -y + r, r, -Math.PI / 2, 0); s.lineTo(x, y - r); s.absarc(x - r, y - r, r, 0, Math.PI / 2);
    s.lineTo(-x + r, y); s.absarc(-x + r, y - r, r, Math.PI / 2, Math.PI); s.lineTo(-x, -y + r); s.absarc(-x + r, -y + r, r, Math.PI, Math.PI * 1.5);
    const g = new THREE.ShapeGeometry(s, seg), p = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / w + 0.5, p.getY(i) / h + 0.5);
    return g;
  };
  // Tube along a list of [x,y,z] points (smooth Catmull-Rom). closed loops allowed.
  K.tube = (pts, radius = 0.05, o = {}) => {
    const curve = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], p[1], p[2] || 0)), !!o.closed, 'centripetal');
    const g = new THREE.TubeGeometry(curve, o.segments || Math.max(8, pts.length * 3), radius, o.radial || 12, !!o.closed);
    g.userData.curve = curve;
    return g;
  };
  // Set instance i of an InstancedMesh: K.place(mesh, i, [x,y,z], [rx,ry,rz], scale | [sx,sy,sz]). Call
  // mesh.instanceMatrix.needsUpdate = true once after a batch.

  // focus on) and aperture radius in world units (0 = everything sharp).

  // Code-built lighting environment for reflections and soft fill (replaces an HDRI). K.env(S, { top, horizon,
  // bottom: sky gradient colours; panels: [{ pos:[x,y,z], size:[w,h], color, power }] bright rectangles that face the
  // origin (softboxes, windows, a sun); intensity; background: true to also show it behind the scene; blur }).
  // Metal and glass can only shine if the environment has something bright in it.
  K.env = (S, o = {}) => {
    const es = new THREE.Scene();

      side: THREE.BackSide, depthWrite: false,
      uniforms: { top: { value: new THREE.Color(o.top || '#0b0d12') }, hor: { value: new THREE.Color(o.horizon || o.top || '#14171f') }, bot: { value: new THREE.Color(o.bottom || o.horizon || '#050506') }, gain: { value: o.skyPower == null ? 1 : o.skyPower } },
      vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec3 vD; uniform vec3 top, hor, bot; uniform float gain; void main(){ float y = normalize(vD).y; vec3 c = y > 0.0 ? mix(hor, top, pow(y, 0.6)) : mix(hor, bot, pow(-y, 0.5)); gl_FragColor = vec4(c * gain, 1.0); }',
    }));

    return rt.texture;

  // gives true soft-edged shadows (bigger = softer). o: pos, target, color, power, angle, penumbra, soft, mapSize, near, far.
  K.spot = (S, o = {}) => {
    const l = new THREE.SpotLight(o.color || '#ffffff', o.power == null ? 80 : o.power, o.distance || 0, o.angle == null ? 0.5 : o.angle, o.penumbra == null ? 0.6 : o.penumbra, o.decay == null ? 2 : o.decay);
    l.position.set(...(o.pos || [3, 6, 4])); l.target.position.set(...(o.target || [0, 0, 0]));
    l.castShadow = o.shadow !== false; l.shadow.mapSize.setScalar(o.mapSize || 2048); l.shadow.bias = o.bias == null ? -0.0004 : o.bias; l.shadow.normalBias = o.normalBias == null ? 0.02 : o.normalBias;
    l.shadow.camera.near = o.near || 0.5; l.shadow.camera.far = o.far || 60;
    S.scene.add(l, l.target);

  };
  // A sun: parallel light with shadows. `size` is the half-width of the area that gets shadows, `soft` the blur of
  // shadow edges in world units at the light (0.3-1.5 looks natural). o: pos, target, color, power, size, soft, mapSize.
  K.sun = (S, o = {}) => {
    const l = new THREE.DirectionalLight(o.color || '#ffffff', o.power == null ? 3 : o.power);
    l.position.set(...(o.pos || [6, 10, 5])); l.target.position.set(...(o.target || [0, 0, 0]));

<script type="text/plain" id="src-sound">// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.

  'use strict';

    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }

      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },

      if (name === 'room') noise(t0, long({ color: 'brown', filter: 'lowpass', f: 320, gain: 0.12 * g }));
      else if (name === 'hiss') noise(t0, long({ color: 'pink', filter: 'highpass', f: 5000, gain: 0.02 * g }));
      else if (name === 'hum') { tone(t0, long({ f: 60, gain: 0.05 * g })); tone(t0, long({ f: 120, gain: 0.025 * g })); tone(t0, long({ f: 180, type: 'triangle', gain: 0.012 * g })); }
      else if (name === 'rain') { noise(t0, long({ color: 'pink', filter: 'bandpass', f: 2500, q: 0.4, gain: 0.08 * g })); const r = rand('rain'); for (let x = 0; x < d; x += 0.04 + r() * 0.08) noise(t0 + x, { dur: 0.01, filter: 'highpass', f: 4000, gain: 0.04 * g * r(), bus: 'amb', pan: r() * 1.6 - 0.8 }); }
      else if (name === 'projector') { noise(t0, long({ color: 'pink', filter: 'highpass', f: 3000, gain: 0.03 * g })); for (let x = 0; x < d; x += 1 / 24) S.tock(t0 + x, { f: 700, g: 0.04 * g, pan: 0.3 }); }
      else if (name === 'vinyl') { noise(t0, long({ color: 'pink', filter: 'bandpass', f: 1500, q: 0.5, gain: 0.025 * g })); const r = rand('vinyl'); for (let x = 0; x < d; x += 0.08 + r() * 0.4) noise(t0 + x, { dur: 0.006, filter: 'highpass', f: 2500, gain: 0.08 * g * r(), bus: 'amb' }); }

    }

    // ---- music: optional light beds that sit under the effects. music(name, t0, t1, { bpm, chords, gain })
    // chords: list of note arrays, one per bar, cycled. e.g. [['C4','E4','G4','B4'], ['A3','C4','E4','G4']]
    function music(name, t0, t1, p) {
      if (VO) return;
      p = p || {}; const g = p.gain == null ? 1 : p.gain, bpm = p.bpm || 100, beat = 60 / bpm, bar = beat * 4;
      const chords = p.chords || [['C4', 'E4', 'G4', 'B4'], ['A3', 'C4', 'E4', 'G4'], ['F3', 'A3', 'C4', 'E4'], ['G3', 'B3', 'D4', 'F4']];
      let i = 0;
      for (let t = t0; t < t1 - 0.05; t += bar, i++) {
        const ch = chords[i % chords.length], len = Math.min(bar, t1 - t);

        if (name === 'pulse') for (let b = 0; b < 4 && t + b * beat < t1 - 0.05; b++) {
          const tb = t + b * beat;
          tone(tb, { f: [[0, 110], [0.1, 50]], dur: 0.18, gain: (b % 2 ? 0.16 : 0.26) * g, bus: 'music' });
          noise(tb + beat / 2, { dur: 0.04, filter: 'highpass', f: 7000, gain: 0.05 * g, bus: 'music' });
          tone(tb + beat / 2, { f: hz(ch[0]) / 2, type: 'triangle', dur: beat * 0.45, gain: 0.08 * g, bus: 'music' });
        }
        if (name === 'chip') for (let s = 0; s < 8 && t + s * beat / 2 < t1 - 0.05; s++) {
          const ts = t + s * beat / 2;
          tone(ts, { f: hz(ch[0]) / 2, type: 'triangle', dur: beat * 0.45, gain: 0.12 * g, a: 0.001, hold: beat * 0.35, bus: 'music' });
          tone(ts, { f: ch[[0, 1, 2, 3, 2, 1, 2, 3][s]], type: 'square', dur: beat * 0.4, gain: 0.03 * g, a: 0.001, hold: beat * 0.25, bus: 'music' });
        }
      }
    }

    return { play, bed, music, tone, noise, withMinor, hz, vo: VO, sounds: Object.keys(S) };
  };

  // Live playback for a player: SOUND.live(scoreFn, fromT, { voiceover, master }) starts the score from explainer time
  // fromT right now and returns stop(). Call stop() on pause or seek, and SOUND.live again on play.
  SOUND.live = function (fn, fromT, opts) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    fn(SOUND.kit(ctx, Object.assign({}, opts, { start: fromT || 0, delay: 0.03 })));
    return () => { try { ctx.close(); } catch (e) {} };
  };

  // Render a style's explainerSound into an OfflineAudioContext; returns interleaved float stereo.
  SOUND.renderOffline = async function (fn, duration, sampleRate, kitOpts) {
    const sr = sampleRate || 48000, len = Math.ceil(duration * sr);
    const ctx = new OfflineAudioContext(2, len, sr);
    fn(SOUND.kit(ctx, kitOpts || {}));
    const buf = await ctx.startRendering();

    let peak = 0;
    for (let i = 0; i < len; i++) { inter[2 * i] = L[i]; inter[2 * i + 1] = R[i]; peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); }
    return { inter, peak, frames: len, sr };
  };
})();

<script type="text/plain" id="src-style">{
  // ---------------------------------------------------------------- content
  const TITLE = ['INSIDE AN UNDERSEA', 'FIBRE-OPTIC CABLE'];
  const OVERLINE = 'X-RAY  /  SECTION SCAN';
  const PARTS = [
    { name: 'STEEL ARMOUR', note: 'shrugs off anchors + nets', at: 3.6 },
    { name: 'COPPER TUBE', note: 'feeds power to the repeaters', at: 5.0 },
    { name: 'GLASS FIBRES', note: 'light pulses carry the data', at: 6.4 },
  ];
  const SCAN = [0.8, 2.9];
  const COOL = '#b0d0ec', ACCENT = '#ff9a22';
  const MM = 17 / 3;                 // millimetres per world unit: the cable is 17 mm across (3 units)

  // ---------------------------------------------------------------- the cable, lying along its own axis (local y), radii in world units
  const LEN = 8.4, HALF = LEN / 2, AXIS_Y = 1.5;
  const R_SHEATH = [1.4, 1.5], R_WIRE = 1.2, WIRE_R = 0.18, N_WIRE = 16, PITCH = 13;
  const R_COPPER = [0.82, 0.98], R_INSUL = [0.52, 0.8], R_TUBE = [0.4, 0.47], R_FIBRE = 0.1, FIBRE_RING = 0.235;
  const FIBRES = [[0, 0]].concat([0, 1, 2, 3, 4, 5].map((i) => [FIBRE_RING * Math.cos(i * Math.PI / 3), FIBRE_RING * Math.sin(i * Math.PI / 3)]));

  // ---------------------------------------------------------------- the flows (shared by picture and sound): rays in the camera-facing plane, [x, signed distance from axis]
  const HEAT = (() => {
    const rays = [];
    // 1 force: four knocks from outside, all stopped by the armour
    [1.2, 2.1, 3.0, 3.9].forEach((x, i) => rays.push({ part: 0, pts: [[x, -2.35], [x, -1.37]], t0: PARTS[0].at - 0.45 + i * 0.07, dur: 0.42, bar: [x, -1.39, 0], speed: 0.9, rep: 2 }));
    // 2 current: runs the whole length down the copper tube, out on one side and back on the other
    [0.9, -0.9].forEach((r, i) => rays.push({ part: 1, pts: [[r > 0 ? -3.9 : 3.9, r], [r > 0 ? 3.9 : -3.9, r]], t0: PARTS[1].at - 0.45 + i * 0.06, dur: 1.35, bar: null, speed: 0.9, rep: 2 }));
    // 3 light: fast pulses down each of the glass fibres
    [0, 0.2, -0.2].forEach((r, i) => rays.push({ part: 2, pts: [[-3.9, r], [3.9, r]], t0: PARTS[2].at - 0.4 + i * 0.05, dur: 0.95, bar: null, speed: 2.6, rep: 6 }));
    rays.forEach((r) => { r.stop = r.t0 + r.dur; });
    return rays;
  })();

  registerStyle({
    id: 'x-ray',
    name: 'X-Ray',
    family: 'Filters over 3D',
    topic: 'How a fibre-optic cable under the sea is built and works',
    duration: 9.6,
    fonts: ['700 78px "Space Grotesk"', '500 44px "Space Grotesk"', '500 30px "IBM Plex Mono"'],
    render: { samples: 48, shutter: 0.5, tone: 'neutral', exposure: 1.0, bloom: 0.5, bloomThreshold: 0.9, vignette: 0.34, grain: 0.025, fov: 22, background: '#050607' },

    build(S) {
      const { THREE, K, scene, camera, renderer } = S;
      renderer.localClippingEnabled = true;

      const cutPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);
      const CUT = { value: new THREE.Vector4() }, REF = { value: new THREE.Vector4(0, 1, 0, 0) };
      const setCut = (x) => { cutPlane.constant = -x; CUT.value.set(-1, 0, 0, x); };

      const xray = (color, density, sheet = 0) => new THREE.ShaderMaterial({
        uniforms: { uColor: { value: new THREE.Color(color) }, uK: { value: density }, uSheet: { value: sheet }, uCut: CUT, uRef: REF },
        vertexShader: 'varying vec3 vW, vN; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vN = mat3(modelMatrix) * normal; gl_Position = projectionMatrix * viewMatrix * w; }',
        fragmentShader: `uniform vec3 uColor; uniform float uK, uSheet; uniform vec4 uCut, uRef; varying vec3 vW, vN;
          void main(){
            vec3 ro = cameraPosition, rd = vW - ro; float d = length(rd), len; rd /= d;
            if (uSheet > 0.0) {
              if (dot(uCut.xyz, vW) + uCut.w < 0.0) discard;
              len = uSheet / max(abs(dot(normalize(vN), rd)), 0.07);
            } else {
              float dn = dot(uCut.xyz, rd); dn = abs(dn) < 1e-5 ? 1e-5 : dn;
              float sc = -(dot(uCut.xyz, ro) + uCut.w) / dn;
              d = dn > 0.0 ? max(d, sc) : min(d, sc);
              len = (gl_FrontFacing ? -1.0 : 1.0) * (d + (dot(uRef.xyz, ro) + uRef.w) / dot(uRef.xyz, rd));
            }
            gl_FragColor = vec4(uColor * uK * len, 1.0);
          }`,
        side: THREE.DoubleSide, transparent: true, depthTest: false, depthWrite: false,
        blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
      });

      const sectioned = (geo, mat, capColor, capGain) => {
        mat.clippingPlanes = [cutPlane]; mat.clipShadows = true;
        const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true;
        const cap = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: new THREE.Color(capColor).multiplyScalar(capGain), side: THREE.BackSide, clippingPlanes: [cutPlane] }));
        m.add(cap); return m;
      };

      const revolve = (loop, seg = 128) => {
        let area = 0; loop.forEach((p, i) => { const q = loop[(i + 1) % loop.length]; area += p[0] * q[1] - q[0] * p[1]; });
        const pts = (area < 0 ? loop.slice().reverse() : loop).map(([r, y]) => new THREE.Vector2(r, y));
        if (pts[0].x > 1e-6 || pts[pts.length - 1].x > 1e-6) pts.push(pts[0].clone());
        return new THREE.LatheGeometry(pts, seg);
      };
      const ring = (r0, r1, y0, y1) => revolve([[r0, y0], [r1, y0], [r1, y1], [r0, y1]]);

      // a closed, capped wire that winds round the axis (a strand of the armour)
      const helix = (phi0) => {
        const N = 240, M = 12, k = 2 * Math.PI / PITCH, pos = [], nor = [], uv = [], idx = [];
        const T = new THREE.Vector3(), n = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        const frame = (i) => {
          const y = LEN * i / N, ph = phi0 + k * y;
          c.set(WIRE_R_C * Math.cos(ph), y, WIRE_R_C * Math.sin(ph));
          T.set(-WIRE_R_C * k * Math.sin(ph), 1, WIRE_R_C * k * Math.cos(ph)).normalize();
          n.set(Math.cos(ph), 0, Math.sin(ph)); n.addScaledVector(T, -n.dot(T)).normalize(); b.crossVectors(T, n);
        };
        const WIRE_R_C = R_WIRE;
        for (let i = 0; i <= N; i++) {
          frame(i);
          for (let j = 0; j <= M; j++) {
            const a = 2 * Math.PI * j / M, ca = Math.cos(a), sa = Math.sin(a);
            pos.push(c.x + WIRE_R * (ca * n.x + sa * b.x), c.y + WIRE_R * (ca * n.y + sa * b.y), c.z + WIRE_R * (ca * n.z + sa * b.z));
            nor.push(ca * n.x + sa * b.x, ca * n.y + sa * b.y, ca * n.z + sa * b.z); uv.push(j / M, i / N * 8);
          }
        }
        const tri = (a, bb, cc, want) => {   // keep the triangle facing the way `want` says
          const ax = pos[3 * a], ay = pos[3 * a + 1], az = pos[3 * a + 2];
          const ux = pos[3 * bb] - ax, uy = pos[3 * bb + 1] - ay, uz = pos[3 * bb + 2] - az, vx = pos[3 * cc] - ax, vy = pos[3 * cc + 1] - ay, vz = pos[3 * cc + 2] - az;
          const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
          if (nx * want[0] + ny * want[1] + nz * want[2] >= 0) idx.push(a, bb, cc); else idx.push(a, cc, bb);
        };
        for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) {
          const a = i * (M + 1) + j, bb = a + 1, cc = a + M + 1, dd = cc + 1;
          const w = [nor[3 * a], nor[3 * a + 1], nor[3 * a + 2]];
          tri(a, cc, bb, w); tri(bb, cc, dd, w);
        }
        for (const [i, s] of [[0, -1], [N, 1]]) {   // end caps
          frame(i); const base = pos.length / 3;
          pos.push(c.x, c.y, c.z); nor.push(T.x * s, T.y * s, T.z * s); uv.push(0.5, 0.5);
          for (let j = 0; j <= M; j++) { const a = 2 * Math.PI * j / M, ca = Math.cos(a), sa = Math.sin(a); pos.push(c.x + WIRE_R * (ca * n.x + sa * b.x), c.y + WIRE_R * (ca * n.y + sa * b.y), c.z + WIRE_R * (ca * n.z + sa * b.z)); nor.push(T.x * s, T.y * s, T.z * s); uv.push(0.5, 0.5); }
          for (let j = 0; j < M; j++) tri(base, base + 1 + j, base + 2 + j, [T.x * s, T.y * s, T.z * s]);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
        g.computeBoundingSphere(); return g;
      };

      // ================================================================ the scene
      K.env(S, { top: '#0b0d11', horizon: '#08090c', bottom: '#020203', panels: [
        { pos: [0, 12, 5], size: [20, 2.6], color: '#eef4ff', power: 7 },
        { pos: [0, 15, -2], size: [26, 12], color: '#dfe8f5', power: 1.1 },
        { pos: [-13, 4, 3], size: [3, 7], color: '#cfe0ff', power: 6 },
        { pos: [5, 4, -13], size: [12, 3], color: '#8fb6ff', power: 2.2 },
      ] });
      const key = K.spot(S, { pos: [-5, 11, 7.5], target: [0, 1, 0], color: '#fff3e2', power: 1500, angle: 0.62, penumbra: 0.95, soft: 0.8 });

      const bed = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: '#0e1115', roughness: 0.62, metalness: 0.2 }));
      bed.rotation.x = -Math.PI / 2; bed.receiveShadow = true; scene.add(bed);
      const BW = 26, PX = 4096 / BW;
      const marksTex = K.canvasTex(4096, 4096, (c) => {
        const X = (x) => (x + BW / 2) * PX, Z = X, line = (x0, z0, x1, z1, a, w = 2) => { c.strokeStyle = `rgba(168,207,242,${a})`; c.lineWidth = w; c.beginPath(); c.moveTo(X(x0), Z(z0)); c.lineTo(X(x1), Z(z1)); c.stroke(); };
        c.fillStyle = '#000'; c.fillRect(0, 0, 4096, 4096);
        const step = 2 / MM, x0 = -HALF;                                         // a 2 mm grid, a heavier line every 10 mm
        for (let i = -30; i <= 60; i++) { const major = i % 5 === 0, x = x0 + i * step; if (Math.abs(x) < 9.5) line(x, -5.5, x, 5.5, major ? 0.13 : 0.05, major ? 2 : 1.5); }
        for (let i = -15; i <= 15; i++) { const major = i % 5 === 0, z = i * step; line(-9.5, z, 9.5, z, major ? 0.13 : 0.05, major ? 2 : 1.5); }
        c.setLineDash([36, 10, 6, 10]); line(-6.2, 0, 6.2, 0, 0.5, 2); c.setLineDash([]);
        const px = 5.7, pz = 3.6; c.strokeStyle = 'rgba(168,207,242,0.3)'; c.lineWidth = 2; c.strokeRect(X(-px), Z(-pz), 2 * px * PX, 2 * pz * PX);
        for (const sx of [-1, 1]) for (const sz of [-1, 1]) { line(sx * px, sz * pz, sx * (px - 0.45), sz * pz, 0.85, 5); line(sx * px, sz * pz, sx * px, sz * (pz - 0.45), 0.85, 5); }
        for (let i = -5; i <= 30; i += 5) for (let j = -10; j <= 10; j += 5) { const x = x0 + i * step, z = j * step; if (Math.abs(x) < px) { line(x - 0.07, z, x + 0.07, z, 0.32, 2.5); line(x, z - 0.07, x, z + 0.07, 0.32, 2.5); } }
        const bl = 10 / MM, bx = -0.5, bz = 2.6; line(bx, bz, bx + bl, bz, 0.9, 4); line(bx, bz - 0.09, bx, bz + 0.09, 0.9, 4); line(bx + bl, bz - 0.09, bx + bl, bz + 0.09, 0.9, 4);
        c.font = '500 44px "IBM Plex Mono"'; c.textAlign = 'left'; c.textBaseline = 'bottom'; c.fillStyle = 'rgba(168,207,242,0.9)'; c.fillText('10 mm', X(bx), Z(bz - 0.12));
      });
      const marks = new THREE.Mesh(new THREE.PlaneGeometry(BW, BW), new THREE.MeshBasicMaterial({ map: marksTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
      marks.rotation.x = -Math.PI / 2; marks.position.y = 0.004; scene.add(marks);

      const brush = K.canvasTex(64, 2048, (c) => { const r = K.rng(3); for (let y = 0; y < 2048; y++) { const v = Math.round(160 + r.range(-22, 22) + (r.chance(0.03) ? r.range(-30, 25) : 0)); c.fillStyle = `rgb(${v},${v},${v})`; c.fillRect(0, y, 64, 1); } }, { data: true });
      const steel = (color, rough) => new THREE.MeshStandardMaterial({ color, metalness: 0.9, roughness: rough, roughnessMap: brush, bumpMap: brush, bumpScale: 0.03 });
      const plastic = (color, rough = 0.42) => new THREE.MeshStandardMaterial({ color, metalness: 0, roughness: rough });

      // ---- the cable: every part is a closed geometry with two looks, lit and sectioned, and X-ray film
      const cable = new THREE.Group(); cable.rotation.z = -Math.PI / 2; cable.position.set(-HALF, AXIS_Y, 0); scene.add(cable);
      const lit = new THREE.Group(), film = new THREE.Group(); cable.add(lit, film);
      const X = {};
      const part = (name, geo, litMat, cap, capGain, density, color = COOL, share) => {
        const id = share || name;
        if (litMat) lit.add(sectioned(geo, litMat, cap, capGain));
        if (!X[id]) X[id] = xray(color, density);
        const m = new THREE.Mesh(geo, X[id]); m.frustumCulled = false; film.add(m); return m;
      };
      part('sheath', ring(R_SHEATH[0], R_SHEATH[1], 0, LEN), plastic('#101215', 0.5), COOL, 0.8, 0.28);
      for (let i = 0; i < N_WIRE; i++) part('wire' + i, helix(2 * Math.PI * i / N_WIRE), steel('#aeb4bc', 0.5), COOL, 1.7, 0.34, COOL, 'armour');
      part('copper', ring(R_COPPER[0], R_COPPER[1], 0, LEN), new THREE.MeshStandardMaterial({ color: '#b9774a', metalness: 1, roughness: 0.32 }), COOL, 1.7, 0.55);
      part('insul', ring(R_INSUL[0], R_INSUL[1], 0, LEN), plastic('#1d2024', 0.45), COOL, 0.6, 0.12);
      part('tube', ring(R_TUBE[0], R_TUBE[1], 0, LEN), steel('#c4c8ce', 0.45), COOL, 1.7, 0.6);
      FIBRES.forEach(([a, b], i) => {
        const g = new THREE.CylinderGeometry(R_FIBRE, R_FIBRE, LEN, 24, 1); g.translate(a, LEN / 2, b);
        part('fibre' + i, g, new THREE.MeshStandardMaterial({ color: '#a9cdee', metalness: 0, roughness: 0.15 }), ACCENT, 1.25, 1.1, COOL, 'fibre');
      });

      // ---- the scanning plane
      const sheet = new THREE.Mesh(new THREE.PlaneGeometry(6.2, 4.1), new THREE.ShaderMaterial({
        uniforms: { uColor: { value: new THREE.Color(COOL) }, uGain: { value: 1 } },
        vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: `uniform vec3 uColor; uniform float uGain; varying vec2 vUv;
          void main(){ vec2 e = min(vUv, 1.0 - vUv) * vec2(6.2, 4.1); float frame = smoothstep(0.035, 0.0, min(e.x, e.y)) * 1.6, floorLine = smoothstep(0.07, 0.0, vUv.y * 4.1) * 3.0;
            gl_FragColor = vec4(uColor * uGain * (0.035 + 0.05 * (1.0 - vUv.y) + frame + floorLine), 1.0); }`,
        side: THREE.DoubleSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      }));
      sheet.rotation.y = Math.PI / 2; scene.add(sheet);

      // ---- flows: ribbons, arrow heads and small stop bars, in one plane that turns to face the camera
      const heat = new THREE.Group(); heat.matrixAutoUpdate = false; scene.add(heat);
      const HOT = new THREE.Color(ACCENT).lerp(new THREE.Color('#ffffff'), 0.4);
      const glow = (gain = 1) => new THREE.MeshBasicMaterial({ color: HOT.clone().multiplyScalar(gain), blending: THREE.AdditiveBlending, transparent: true, depthTest: false, depthWrite: false });
      const ribbon = (pts, w) => {
        const pos = [], aS = [], aV = [], idx = [], acc = [0];
        for (let i = 1; i < pts.length; i++) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
