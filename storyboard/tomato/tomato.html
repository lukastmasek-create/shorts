<script type="text/plain" id="k-sound">// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).

      k.play('tock', T.seedLand, { gain: 0.9, f: 760 }); k.play('pop', T.cover, { gain: 0.8, f: 330 });
      k.play('whoosh', T.cloudIn, { gain: 0.45, dur: 0.85, top: 1500 });
      k.bed('rain', T.rain[0] - 0.1, T.rain[1] + 0.35, { gain: 2.4 });
      k.withMinor(() => { for (let i = 0; i < 26; i++) k.play('tick', T.rain[0] + 0.3 + (i + r()) / 26 * (T.rain[1] - T.rain[0]), { gain: 0.35, f: 2600 + r() * 2200, pan: r.range(-0.4, 0.4) }); });
      // every new word: the old one is knocked off, the new one clicks on letter by letter
      STAGES.slice(1).forEach((s) => {
        k.play('swish', s.at - 0.1, { gain: 0.6 });
        [...s.word].forEach((_, i) => k.play('tock', s.at + 0.19 + (i + 0.5) / s.word.length * SWEEP, { gain: 0.6, f: 980 + i * 60, pan: (i - s.word.length / 2) * 0.12 }));
      });
      [0, 1, 2, 3].forEach((i) => k.play('pop', T.sprout + i * 0.085, { gain: 0.6, f: 520 + i * 130 }));
      k.play('ding', T.sun + 0.05, { gain: 0.55, f: 'E6' }); k.play('sparkle', T.sun + 0.35, { gain: 0.6, n: 5 });
      k.play('tock', T.stake + 0.3, { gain: 0.8, f: 300 });
      const scale = ['C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6', 'E6', 'G6', 'A6', 'C7'];
      k.withMinor(() => scale.forEach((n, i) => k.play('pop', T.grow + 0.12 + i * T.growDur / scale.length, { gain: 0.5, f: hz(n), pan: i % 2 ? 0.2 : -0.2 })));
      // flowers open, the bee buzzes in from the left, lands on each one, buzzes off to the right
      FRUITS.forEach((_, g) => k.play('blip', T.flower + g * 0.08, { gain: 0.5, f: ['E6', 'G6', 'A6', 'C7', 'D7', 'E7', 'G7', 'A7'][g], type: 'sine' }));
      const bd = T.bee[1] - T.bee[0];
      k.tone(T.bee[0], { f: [[0, 190], [bd * 0.25, 250], [bd * 0.5, 215], [bd * 0.75, 260], [bd, 200]], type: 'sawtooth', dur: bd, gain: 0.05, a: 0.25, hold: bd - 0.6, filter: 'lowpass', f2: 900, pan: -0.4, verb: 0.1 });
      k.tone(T.bee[0], { f: [[0, 193], [bd * 0.25, 253], [bd * 0.5, 218], [bd * 0.75, 263], [bd, 203]], type: 'sawtooth', dur: bd, gain: 0.04, a: 0.25, hold: bd - 0.6, filter: 'lowpass', f2: 800, pan: 0.4 });
      VISITS.forEach(([g, tv], i) => { k.play('tick', tv + 0.08, { gain: 0.8, f: 3800 }); k.play('blip', tv + 0.08, { gain: 0.45, f: ['E6', 'G6', 'A6', 'C7', 'D7'][i], type: 'sine', pan: (i - 2) * 0.2 }); });
      k.play('sparkle', 8.3, { gain: 0.4, n: 4 });
      FRUITS.forEach((_, g) => k.play('pop', T.fruit + g * 0.07 + 0.05, { gain: 0.75, f: 300 - g * 14 }));
      k.play('success', T.ripe + 0.55, { gain: 0.5, f: 'C6' });
      k.play('ding', T.done - 0.1, { gain: 0.4, f: 'G6' });
    },
  });
}
</script>
<script type="module">
import * as THREE from 'three'; window.THREE = THREE;
for (const id of ['k-stage', 'k-sound', 'k-style']) { const s = document.createElement('script'); s.textContent = document.getElementById(id).textContent; document.head.appendChild(s); }
const q = new URLSearchParams(location.search), render = q.has('render');
if (render) document.body.classList.add('render');
const style = STYLES[0], canvas = document.getElementById('c');
const S = await K.run(canvas, style, { samples: +(q.get('samples') || (render ? style.render.samples : 3)) });
window.seek = (t) => S.seek(t); window.DURATION = style.duration; window.STYLE = style;
const $ = (id) => document.getElementById(id), D = style.duration;
let t = 0, playing = false, soundOn = true, loop = true, stopSound = () => {}, last = 0;
const show = () => { $('seek').value = t / D; $('time').textContent = t.toFixed(1) + ' / ' + D.toFixed(1) + ' s'; };
const draw = () => { S.seek(t); show(); };
const startSound = () => { stopSound(); if (soundOn && playing) stopSound = SOUND.live((k) => style.sound(k), t, { voiceover: false }); };
const stop = () => { stopSound(); stopSound = () => {}; };
function frame(now) {
  if (!playing) return;
  t += (now - last) / 1000; last = now;
  if (t >= D) { if (loop) { t = 0; startSound(); } else { t = D; playing = false; stop(); $('play').textContent = 'Play'; } }
  draw(); requestAnimationFrame(frame);
}
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; if (playing) { if (t >= D) t = 0; last = performance.now(); startSound(); requestAnimationFrame(frame); } else stop(); };
$('seek').oninput = (e) => { t = +e.target.value * D; stop(); draw(); if (playing) startSound(); };
$('snd').onclick = () => { soundOn = !soundOn; $('snd').setAttribute('aria-pressed', soundOn); $('snd').textContent = soundOn ? 'Sound on' : 'Sound off'; if (soundOn) startSound(); else stop(); };
$('loop').onclick = () => { loop = !loop; $('loop').setAttribute('aria-pressed', loop); $('loop').textContent = loop ? 'Loop on' : 'Loop off'; };
draw();
</script>
